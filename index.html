<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mobile Permission Lab</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#0f172a;
    color:white;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr;
    gap:15px;
}

.card{
    background:#1e293b;
    border-radius:20px;
    padding:18px;
}

.card h2{
    font-size:18px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    margin-top:10px;
}

.status{
    margin-top:10px;
    color:#94a3b8;
    font-size:14px;
}

video{
    width:100%;
    border-radius:14px;
    margin-top:10px;
}
</style>
</head>
<body>

<h1>📱 Mobile Permission Lab</h1>

<div class="grid">

<div class="card">
<h2>📍 Location</h2>
<button onclick="getLocation()">Request</button>
<div id="loc" class="status"></div>
</div>

<div class="card">
<h2>📷 Camera</h2>
<button onclick="getCamera()">Enable</button>
<video id="cam" autoplay playsinline></video>
<div id="camStatus" class="status"></div>
</div>

<div class="card">
<h2>🎤 Microphone</h2>
<button onclick="getMic()">Enable</button>
<div id="micStatus" class="status"></div>
</div>

<div class="card">
<h2>🖥 Fullscreen</h2>
<button onclick="goFullscreen()">Enter Fullscreen</button>
</div>

<div class="card">
<h2>🎬 Picture In Picture</h2>

<video id="pipVideo" controls loop>
<source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
</video>

<button onclick="enablePIP()">Enable PiP</button>
</div>

<div class="card">
<h2>📥 Demo File Download</h2>
<button onclick="downloadDemo()">Download TXT</button>
</div>

<div class="card">
<h2>📋 Clipboard</h2>
<button onclick="copyClipboard()">Copy Text</button>
<div id="clipStatus" class="status"></div>
</div>

<div class="card">
<h2>📺 Screen Share</h2>
<button onclick="shareScreen()">Share Screen</button>
<div id="screenStatus" class="status"></div>
</div>

<div class="card">
<h2>📳 Vibration</h2>
<button onclick="vibratePhone()">Vibrate</button>
</div>

<div class="card">
<h2>🔔 Notifications</h2>
<button onclick="notify()">Allow Notification</button>
<div id="notifStatus" class="status"></div>
</div>

<div class="card">
<h2>🔋 Battery Info</h2>
<button onclick="batteryInfo()">Get Battery</button>
<div id="battery" class="status"></div>
</div>

<div class="card">
<h2>📶 Network Info</h2>
<button onclick="networkInfo()">Check Network</button>
<div id="network" class="status"></div>
</div>

</div>

<script>

async function getLocation(){
navigator.geolocation.getCurrentPosition(
(pos)=>{
document.getElementById('loc').innerText=
`${pos.coords.latitude}, ${pos.coords.longitude}`;
},
()=>{
document.getElementById('loc').innerText='Denied';
});
}

async function getCamera(){
try{
const stream=await navigator.mediaDevices.getUserMedia({video:true});
document.getElementById('cam').srcObject=stream;
document.getElementById('camStatus').innerText='Camera Enabled';
}catch{
document.getElementById('camStatus').innerText='Denied';
}
}

async function getMic(){
try{
await navigator.mediaDevices.getUserMedia({audio:true});
document.getElementById('micStatus').innerText='Microphone Enabled';
}catch{
document.getElementById('micStatus').innerText='Denied';
}
}

function goFullscreen(){
document.documentElement.requestFullscreen();
}

async function enablePIP(){
const video=document.getElementById('pipVideo');

if(document.pictureInPictureEnabled){
await video.requestPictureInPicture();
}
}

function downloadDemo(){

const blob=new Blob(
['Demo safe file'],
{type:'text/plain'}
);

const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='demo.txt';
a.click();
}

async function copyClipboard(){
await navigator.clipboard.writeText('Hello from Permission Lab');
document.getElementById('clipStatus').innerText='Copied';
}

async function shareScreen(){
try{
await navigator.mediaDevices.getDisplayMedia({
video:true
});
document.getElementById('screenStatus').innerText='Screen Shared';
}catch{
document.getElementById('screenStatus').innerText='Denied';
}
}

function vibratePhone(){
navigator.vibrate([300,100,300]);
}

async function notify(){
const p=await Notification.requestPermission();
document.getElementById('notifStatus').innerText=p;
}

async function batteryInfo(){
if(navigator.getBattery){
const b=await navigator.getBattery();

document.getElementById('battery').innerText=
`Battery: ${Math.round(b.level*100)}%`;
}
}

function networkInfo(){

const c=navigator.connection;

if(c){
document.getElementById('network').innerText=
`${c.effectiveType} | ${c.downlink}Mb/s`;
}
}

</script>

</body>
</html>

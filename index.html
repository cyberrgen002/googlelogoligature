<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Permission Access Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 700px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #2563eb;
    }

    .status {
      margin-top: 20px;
      background: #0f172a;
      padding: 15px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      background: black;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Permission Access Demo</h1>
    <p>Halaman demo untuk request permission browser.</p>

    <button onclick="requestCameraMic()">Request Camera & Microphone</button>
    <button onclick="requestLocation()">Request Location</button>
    <button onclick="requestNotifications()">Request Notification</button>
    <button onclick="requestClipboard()">Request Clipboard</button>
    <button onclick="requestMidi()">Request MIDI</button>
    <button onclick="requestBluetooth()">Request Bluetooth</button>
    <button onclick="requestFullscreen()">Request Fullscreen</button>

    <video id="video" autoplay playsinline muted></video>

    <div class="status" id="status">
Menunggu permission...
    </div>
  </div>

  <script>
    const statusBox = document.getElementById('status');

    function log(text) {
      statusBox.textContent += '\n' + text;
    }

    async function requestCameraMic() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });

        document.getElementById('video').srcObject = stream;
        log('✅ Camera & Microphone granted');
      } catch (err) {
        log('❌ Camera/Microphone denied: ' + err.message);
      }
    }

    async function requestLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          log('❌ Geolocation tidak didukung');
          return resolve();
        }

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            log(`✅ Location granted: ${pos.coords.latitude}, ${pos.coords.longitude}`);
            resolve();
          },
          (err) => {
            log('❌ Location denied: ' + err.message);
            resolve();
          }
        );
      });
    }

    async function requestNotifications() {
      try {
        const result = await Notification.requestPermission();
        log('🔔 Notification permission: ' + result);
      } catch (err) {
        log('❌ Notification error: ' + err.message);
      }
    }

    async function requestClipboard() {
      try {
        await navigator.clipboard.readText();
        log('📋 Clipboard read permission granted');
      } catch (err) {
        log('❌ Clipboard permission denied: ' + err.message);
      }
    }

    async function requestMidi() {
      try {
        await navigator.requestMIDIAccess();
        log('🎹 MIDI permission granted');
      } catch (err) {
        log('❌ MIDI permission denied: ' + err.message);
      }
    }

    async function requestBluetooth() {
      try {
        await navigator.bluetooth.requestDevice({
          acceptAllDevices: true
        });
        log('📶 Bluetooth permission granted');
      } catch (err) {
        log('❌ Bluetooth permission denied: ' + err.message);
      }
    }

    async function requestFullscreen() {
      try {
        const elem = document.documentElement;

        if (elem.requestFullscreen) {
          await elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
          elem.msRequestFullscreen();
        }

        log('🖥️ Fullscreen activated');
      } catch (err) {
        log('❌ Fullscreen failed: ' + err.message);
      }
    }

    </script>
</body>
</html>
